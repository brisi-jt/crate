name: test-integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: crate
          MYSQL_DATABASE: crate
          MYSQL_USER: crate
          MYSQL_PASSWORD: crate
        ports:
          - 3308:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pcrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: mysql+pymysql://crate:crate@127.0.0.1:3308/crate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m integration
