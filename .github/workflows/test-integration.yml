name: test-integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: crate
          MYSQL_DATABASE: crate
          MYSQL_USER: crate
          MYSQL_PASSWORD: crate
        ports:
          - 3308:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pcrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: mysql+pymysql://crate:crate@127.0.0.1:3308/crate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # The integration suite runs against an isolated crate_test database it
      # creates itself; the crate user needs privileges on it first.
      - name: Grant crate user access to the test database
        run: |
          uv run python -c "
          import pymysql
          conn = pymysql.connect(host='127.0.0.1', port=3308, user='root', password='crate')
          with conn.cursor() as cur:
              cur.execute('GRANT ALL PRIVILEGES ON \`crate_test\`.* TO \'crate\'@\'%\'')
              cur.execute('FLUSH PRIVILEGES')
          conn.commit()
          "
      - run: uv run pytest -m integration
