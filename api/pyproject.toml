[project]
name = "crate"
version = "0.1.0"
description = "crate — Spotify playlist intelligence API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.24",
    "pydantic-settings>=2.7",
    "alembic>=1.14",
    "httpx>=0.28",
    # Sync MySQL driver used by Alembic. Migrations run at deploy time, so this
    # belongs in the runtime image.
    "pymysql>=1.1",
    "cryptography>=48.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "ty>=0.0.1a21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crate"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "PTH", "ASYNC", "FAST", "RUF", "TID"]
ignore = [
    "B008",   # function call in default argument — FastAPI Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "S101"]

[tool.ty.src]
include = ["crate", "tests"]

[tool.ty.rules]
# SQLModel/SQLAlchemy descriptor protocol confuses static analysis
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unsupported-operator = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast tests, no external services",
    "integration: requires MySQL (docker compose or CI service container)",
]
addopts = "-m 'not integration'"
